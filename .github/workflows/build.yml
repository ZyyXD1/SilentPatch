name: Build SilentPatchSA

# Manual trigger only. Builds SilentPatchSA.asi (Win32, Release) from the chosen ref.
# Default ref is 'dev', which contains the SA-MP guard for the cursor clip (a3df54d, 2026-08-12).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: false
        default: "dev"

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout (with ModUtils submodule)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # SilentPatchSA needs libflac via the vcpkg manifest (SilentPatchSA/vcpkg.json).
      - name: Enable vcpkg MSBuild integration
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install

      # The project targets v141_xp, which is not on the runner.
      # The README states newer toolsets work after retargeting, so override it on the command line.
      - name: Build SilentPatchSA (Release|Win32)
        shell: pwsh
        run: |
          msbuild SilentPatchSA\SilentPatchSA.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /p:VcpkgEnableManifest=true `
            /verbosity:minimal

      - name: Collect .asi and .ini
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $asi = Get-ChildItem -Recurse -Filter SilentPatchSA.asi | Select-Object -First 1
          if (-not $asi) { throw "SilentPatchSA.asi was not produced" }
          Copy-Item $asi.FullName dist\
          Copy-Item Config\SilentPatchSA.ini dist\
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilentPatchSA-${{ inputs.ref }}
          path: dist/
          if-no-files-found: error
